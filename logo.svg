<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pantheon PTH">
  <title>PANTHEON / PTH</title>
  <rect width="512" height="512" fill="#0a0a0a"/>
  <!-- Pediment / temple triangle -->
  <polygon points="256,72 420,200 92,200" fill="none" stroke="#c9a227" stroke-width="6"/>
  <!-- Columns -->
  <rect x="130" y="200" width="28" height="160" fill="#c9a227"/>
  <rect x="242" y="200" width="28" height="160" fill="#c9a227"/>
  <rect x="354" y="200" width="28" height="160" fill="#c9a227"/>
  <!-- Stylobate -->
  <rect x="92" y="360" width="328" height="14" fill="#c9a227"/>
  <rect x="110" y="380" width="292" height="8" fill="#f5f5f5" opacity="0.85"/>
  <!-- PTH monogram -->
  <text x="256" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" letter-spacing="8" fill="#c9a227">PTH</text>
</svg>
